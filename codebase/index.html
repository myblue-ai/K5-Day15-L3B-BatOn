<!doctype html>
<html lang="vi" data-type="software">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="page-type" content="software"><meta name="site-kind" content="software">
<meta name="description" content="Hỏi trợ giảng BatOn về bài thực hành LLM và mở đoạn bài để kiểm tra câu trả lời.">
<title>BatOn · Phòng học Day 01</title>
<style>
:root{color-scheme:light;--ink:#163730;--forest:#124e40;--line:#cad7cd;--paper:#fafbf5;--quiet:#506359;--lime:#d4f19c;font:16px/1.55 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--paper)}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,a:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #369467;outline-offset:3px}.skip{position:absolute;left:-9999px}.skip:focus{left:10px;top:5px;background:white;z-index:3}
header{border-bottom:1px solid var(--line);background:#fff}header>div,main{width:min(1160px,calc(100% - 48px));margin:auto}.mast{height:70px;display:flex;align-items:center;gap:14px}.brand{font-weight:750;letter-spacing:-.055em;font-size:28px}.dot{color:#628c29}.course{border-left:1px solid var(--line);padding-left:16px;color:var(--quiet)}main{display:grid;grid-template-columns:minmax(240px,.72fr) minmax(0,1.6fr);gap:clamp(24px,4vw,60px);padding:34px 0}
h1,h2,p{margin:0}h1{font:normal clamp(35px,4vw,55px)/1.1 Cambria,Georgia,serif;letter-spacing:-.04em;margin:10px 0 18px}h2{font-size:21px;line-height:1.3}.lesson{background:var(--forest);color:#f5faed;padding:28px;border-radius:15px}.lesson small{color:var(--lime);font-weight:650}.lesson p{color:#e0ebdf}.sources{margin-top:18px}.sources>summary{font-weight:700;padding:10px 0}.sources details{padding:12px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer}summary::marker{color:#5f835c}.sources details summary{font-size:15px;font-weight:600}.sources details p{margin-top:10px;color:var(--quiet)}
.chat{display:flex;flex-direction:column;background:white;border:1px solid var(--line);border-radius:16px;min-height:530px;height:min(72vh,760px);overflow:hidden}.chat-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}.quiet-btn,.example,.cite{background:white;border:1px solid var(--line);border-radius:9px}.quiet-btn{padding:8px 12px;font-size:14px}.feed{overflow:auto;flex:1;min-height:0;padding:22px;scroll-behavior:smooth}.welcome{margin:12px 0 18px}.welcome h2{font:normal 29px Cambria,Georgia,serif}.welcome p{margin:8px 0 15px;color:var(--quiet)}.example{display:block;text-align:left;margin:8px 0;padding:10px 14px}.msg{margin:0 0 19px}.msg strong{font-size:13px;color:var(--quiet)}.msg p{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:4px}.msg.user{background:#edf4e8;border-radius:12px;padding:11px 14px;margin-left:12%}.cite{color:var(--forest);font:600 13px/1.7 monospace;background:#f0f6ea;padding:2px 6px}.composer{border-top:1px solid var(--line);padding:12px 18px}.composer label{font-weight:600;font-size:14px}.input-row{display:flex;align-items:end;gap:10px;margin-top:5px}textarea{flex:1;min-width:0;resize:vertical;min-height:48px;max-height:120px;border:1px solid var(--line);border-radius:9px;padding:10px}.send{border:0;background:var(--forest);color:white;padding:11px 17px;border-radius:9px;font-weight:650}button:hover:enabled{filter:brightness(.95)}#status{font-size:13px;color:var(--quiet);min-height:20px;margin-top:4px}
@media(max-width:740px){header>div,main{width:calc(100% - 28px)}main{grid-template-columns:1fr;gap:14px;padding:16px 0}.mast{height:54px}.lesson{padding:17px 20px}.lesson h1{font-size:30px;margin:3px 0 7px}.sources{margin-top:4px}.chat{height:68dvh;min-height:420px}.chat-head,.feed{padding:14px}.composer{padding:10px 14px}}@media(prefers-reduced-motion:reduce){.feed{scroll-behavior:auto}}
</style>
</head>
<body><a href="#message" class="skip">Đến ô đặt câu hỏi</a>
<header><div class="mast"><span class="brand">BatOn<span class="dot">.</span></span><span class="course">Phòng học pre-class</span></div></header>
<main><aside><div class="lesson"><small>Day 01 · Bài thực hành mô phỏng</small><h1>Làm việc với LLM</h1><p>Temperature, chi phí token và cách nhận phản hồi từ model.</p></div>
<details class="sources" id="sources"><summary>Đọc các đoạn bài</summary><div id="segments"></div></details></aside>
<section class="chat" aria-labelledby="chat-title"><div class="chat-head"><h2 id="chat-title">Trợ giảng Day 01</h2><button class="quiet-btn" id="reset" type="button">Hỏi lại từ đầu</button></div>
<div class="feed" id="feed" role="log" aria-live="polite"><div class="welcome" id="welcome"><h2>Bạn đang vướng ở đâu?</h2><p>Hỏi về bài đang mở. Bấm vào mã đoạn trong câu trả lời để đọc căn cứ.</p>
<button class="example" type="button">Temperature ảnh hưởng thế nào đến câu trả lời?</button><button class="example" type="button">Khi nào nên dùng streaming?</button></div></div>
<form class="composer" id="form"><label for="message">Câu hỏi của bạn</label><div class="input-row"><textarea id="message" rows="1" maxlength="1500" required placeholder="Nhập câu hỏi về Day 01…"></textarea><button class="send" id="send">Gửi ↑</button></div><div id="status" role="status"></div></form>
</section></main>
<script>
'use strict';
const el = id => document.getElementById(id);
const feed = el('feed'), input = el('message'), excerpts = new Map();
const history = [];
let busy = false;
const titles = ['Temperature', 'Thử bốn mức temperature', 'Chi phí token', 'Streaming'];
async function loadLesson() {
  try {
    const response = await fetch('/api/lesson');
    if (!response.ok) throw Error();
    const lesson = await response.json();
    lesson.segments.forEach(({code,text}, i) => {
      const entry = document.createElement('details'), heading = document.createElement('summary'), p = document.createElement('p');
      heading.textContent = code + ' · ' + (titles[i] || 'Đoạn bài'); p.textContent = text;
      entry.append(heading,p); el('segments').append(entry); excerpts.set(code,entry);
    });
  } catch { el('segments').textContent = 'Chưa tải được đoạn bài. Hãy tải lại trang.'; }
}
function addMessage(role, content) {
  el('welcome').hidden = true;
  const article = document.createElement('article'), name = document.createElement('strong'), p = document.createElement('p');
  article.className = 'msg ' + role; name.textContent = role === 'user' ? 'Bạn' : 'BatOn';
  for (const part of content.split(/(\[L3-D\d+-P\d+\])/g)) {
    const entry = excerpts.get(part.slice(1,-1));
    if (role === 'assistant' && part.startsWith('[') && entry) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'cite'; button.textContent = part;
      button.onclick = () => { el('sources').open = true; entry.open = true; entry.querySelector('summary').focus(); };
      p.append(button);
    } else p.append(document.createTextNode(part));
  }
  article.append(name,p); feed.append(article); feed.scrollTop = feed.scrollHeight;
  return article;
}
el('form').onsubmit = async event => {
  event.preventDefault(); const message = input.value.trim(); if (!message || busy) return;
  busy = true; el('send').disabled = el('reset').disabled = true; input.readOnly = true;
  const userMessage = addMessage('user',message); input.value = ''; el('status').textContent = 'Đang đọc bài và tìm căn cứ…';
  try {
    const response = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,history:history.slice(-4)})});
    const data = await response.json(); if (!response.ok) throw Error(data.error || 'Chưa gửi được câu hỏi.');
    addMessage('assistant',data.output);
    history.push({role:'user',content:message},{role:'assistant',content:data.output.slice(0,1500)});
    history.splice(0, Math.max(0,history.length-4)); el('status').textContent = '';
  } catch(error) { userMessage.remove(); input.value = message; el('welcome').hidden = Boolean(history.length); el('status').textContent = error.message || 'Không kết nối được.'; }
  finally {busy = false; input.readOnly = false; el('send').disabled = el('reset').disabled = false; input.focus();}
};
input.onkeydown = e => {if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){e.preventDefault();el('form').requestSubmit();}};
document.querySelectorAll('.example').forEach(button => button.onclick = () => {input.value = button.textContent; input.focus();});
el('reset').onclick = () => {history.length = 0; feed.querySelectorAll('article').forEach(n=>n.remove()); el('welcome').hidden = false; el('status').textContent = input.value = ''; input.focus();};
loadLesson();
</script></body></html>
