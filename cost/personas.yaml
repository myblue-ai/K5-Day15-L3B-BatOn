# Mô phỏng chi phí khi dùng thật — điền ở guide bước 4.2.
# Ôn lại: ngày 13, ngày 1, ngày 14 · lab ngày 13, lab ngày 14.
# Mọi số phải có nguồn (data / phỏng vấn / khảo sát / quy mô khoá có nguồn) hoặc ghi rõ "(tự ước tính)".
# Chạy: python run.py simulate --try   (10 phiên, kiểm khung — làm trước CP3)
#       python run.py simulate         (đủ số phiên dưới đây — bản nộp CP4)

sessions: 50        # số phiên mô phỏng — bản nộp ≥50
seed: 42            # giữ cố định để chạy lại ra cùng chuỗi phiên

users:              # số người dùng thật nếu đưa vào dùng — 3 kịch bản, ở quy mô thật của sản phẩm
  low: 436
  base: 700
  high: 1000
  source: "Cơ sở: lớp L3 hơn 700 học viên (README hackathon); thấp: 436 học viên active trong data/preclass/events.csv; cao: 1000 học viên toàn khoá AI20K (track-a-edtech.md)"

personas:           # ≥3 kiểu người dùng; share cộng lại = 1
  - name: hoi_it
    share: 0.39
    uses_per_month: 3
    turns_per_session: 1
    source: "data/preclass/chat.csv [D6]: 56/145 người (39%) chỉ hỏi 1-2 câu trong 21 ngày"
  - name: hoi_vua
    share: 0.38
    uses_per_month: 8
    turns_per_session: 2
    source: "data/preclass/chat.csv [D6]: 55/145 người (38%) hỏi 3-9 câu; khảo sát câu 4 trung vị 4 lần/tuần"
  - name: hoi_nhieu
    share: 0.23
    uses_per_month: 16
    turns_per_session: 4
    source: "data/preclass/chat.csv [D6]: 34/145 người (23%) chiếm 65% lượt hỏi; khảo sát n=21 câu 4 (4 lần/tuần x 4 tuần)"

prices:             # USD / 1 triệu token — tra từ further-reading/model-prices.md ngày 25/11/2026
  - model: gpt-4o-mini
    input: 0.15
    output: 0.60
    source: "further-reading/model-prices.md · bảng Standard OpenAI ngày 25/11/2026"
  - model: gpt-6.1-terra
    input: 1.00
    output: 5.00
    source: "further-reading/model-prices.md · bảng Standard OpenAI ngày 25/11/2026"

usd_to_vnd:         # Tỷ giá quy đổi tiền Việt
  rate: 25400
  source: "Tỷ giá Vietcombank ngày 25/11/2026"
